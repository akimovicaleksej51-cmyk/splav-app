# Сплав для iPhone.
# version       — версия интерфейса и логики: выпускается пакетом web-vX (приложение скачивает его само);
# nativeVersion — версия нативной части: выпускается .ipa ios-vX для SideStore, только когда её поднимают.
name: iPhone

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', 'src/main.js', 'src/keys.json', '!mobile/source.json', '!mobile/web.json']

permissions:
  contents: write

concurrency:
  group: ios
  cancel-in-progress: false

jobs:
  # 1) версии и пакет обновления — на Linux, это быстро и не ждёт очереди на Мак
  web:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.v.outputs.web }}
      native: ${{ steps.v.outputs.native }}
      nativeExists: ${{ steps.v.outputs.nativeExists }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Версии
        id: v
        run: |
          WEB=$(node -p "require('./package.json').version")
          NATIVE=$(node -p "require('./package.json').nativeVersion || require('./package.json').version")
          echo "web=$WEB" >> "$GITHUB_OUTPUT"; echo "native=$NATIVE" >> "$GITHUB_OUTPUT"
          has() { git ls-remote --exit-code --tags origin "refs/tags/$1" >/dev/null 2>&1 && echo yes || echo no; }
          echo "webExists=$(has web-v$WEB)" >> "$GITHUB_OUTPUT"
          echo "nativeExists=$(has ios-v$NATIVE)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.v.outputs.webExists == 'no'
        with:
          node-version: 22

      - name: Пакет обновления
        if: steps.v.outputs.webExists == 'no'
        run: |
          npm ci && node build.mjs --min
          cd www && zip -qr ../web.zip . && cd ..
          sha256sum web.zip | cut -d' ' -f1 > /tmp/web.sha && cat /tmp/web.sha

      - name: Выпуск обновления
        if: steps.v.outputs.webExists == 'no'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-v${{ steps.v.outputs.web }}
          name: Сплав для iPhone, обновление ${{ steps.v.outputs.web }}
          body: ${{ format('Обновление приходит само. Нужна основа версии {0} или новее.', steps.v.outputs.native) }}
          files: mobile/web.zip
          make_latest: false

      - name: Описание обновления
        if: steps.v.outputs.webExists == 'no'
        run: |
          git config user.name "splav-bot"
          git config user.email "splav-bot@users.noreply.github.com"
          git fetch origin main && git checkout -B main origin/main
          printf '{\n  "version": "%s",\n  "minNative": "%s",\n  "url": "https://github.com/%s/releases/download/web-v%s/web.zip",\n  "checksum": "%s"\n}\n' \
            "${{ steps.v.outputs.web }}" "${{ steps.v.outputs.native }}" "${{ github.repository }}" "${{ steps.v.outputs.web }}" "$(cat /tmp/web.sha)" > web.json
          git add web.json
          git commit -m "Обновление интерфейса ${{ steps.v.outputs.web }}" || exit 0
          for i in 1 2 3; do git push origin main && break; git pull --rebase origin main; done

  # 2) .ipa для SideStore — только когда поднята nativeVersion
  ipa:
    needs: web
    if: needs.web.outputs.nativeExists == 'no'
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Сборка .ipa
        run: |
          npm ci && node build.mjs --min && npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=${{ needs.web.outputs.native }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build | tail -n 40
          test -d build/Build/Products/Release-iphoneos/App.app
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          # в служебном названии Apple принимает только латиницу, а на экране iPhone показываем «Сплав»
          for l in ru en Base; do mkdir -p "Payload/App.app/$l.lproj"; printf '"CFBundleDisplayName" = "Сплав";\n"CFBundleName" = "Сплав";\n' > "Payload/App.app/$l.lproj/InfoPlist.strings"; done
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" -c "Add :CFBundleLocalizations:0 string ru" -c "Add :CFBundleLocalizations:1 string en" Payload/App.app/Info.plist || true
          zip -qry Splav.ipa Payload
          ls -la Splav.ipa

      - name: Выпуск для SideStore
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v${{ needs.web.outputs.native }}
          name: Сплав для iPhone ${{ needs.web.outputs.native }}
          body_path: mobile/RELEASE.md
          files: mobile/Splav.ipa
          make_latest: false

      - name: Источник SideStore
        run: |
          cp Splav.ipa /tmp/Splav.ipa
          git config user.name "splav-bot"
          git config user.email "splav-bot@users.noreply.github.com"
          git fetch origin main && git checkout -B main origin/main
          node scripts/source.mjs /tmp/Splav.ipa "${{ github.repository }}" "ios-v${{ needs.web.outputs.native }}"
          git add source.json
          git commit -m "Источник SideStore: основа ${{ needs.web.outputs.native }}" || exit 0
          for i in 1 2 3; do git push origin main && break; git pull --rebase origin main; done
